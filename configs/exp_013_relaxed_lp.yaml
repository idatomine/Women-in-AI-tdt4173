# Experiment 013: exp 009 + the relaxed_lp group (BRIEFING §4.5 Level 2, the main track).
# One LP per case over all plants and reservoirs with the water balance; leftover water
# valued with the 'path' basis. Sanity check (every 6th train case): LP margin AUC 0.905
# mean over units vs 0.886 for the simple rule; Tokke 0.92-0.93, Vinje 0.88-0.91.
# Hypothesis: the LP adds when water can actually pass through the cascade.

name: exp_013_relaxed_lp
change: "exp 009 + relaxed_lp (LP of the whole watercourse: production, effective water value, margin, fill)"
compare_to: exp_009_tokke_vinje

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics
  - hydro_pressure
  - relaxed_dp
  - tokke_vinje
  - relaxed_lp

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean
  - wv_up_end
  - wv_up_start
  - wv_dn_end
  - net_wv

model:               # unchanged from exp 001
  type: lightgbm
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
