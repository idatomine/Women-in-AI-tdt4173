name: exp_046_no_next_week_price
change: exp 038 without the two features that use the price of the week after the case (scarcity_end, next_week_price)
compare_to: exp_038_dispatch_context
features:
- price_shape
- calendar
- water_value
- hydro
- unit_static
- wv_margin
- scarcity
- case_economics
- relaxed_dp
- tokke_vinje
- relaxed_lp_best
- lp_dispatch_context
drop_features:
- price
- price_wkmean
- wv_up_end
- wv_up_start
- wv_dn_end
- net_wv
- scarcity_end
- next_week_price
model:
  type: lightgbm
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
