# Experiment 028a: LightGBM tuning on the best model (exp 024), one setting changed:
# num_leaves 255 (was 127): bigger trees, more interactions.

name: exp_028a_leaves_255
change: "exp 024 with num_leaves 255 (was 127): bigger trees, more interactions"
compare_to: exp_024_lp_shop

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics
  - relaxed_dp
  - tokke_vinje
  - relaxed_lp_shop

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean
  - wv_up_end
  - wv_up_start
  - wv_dn_end
  - net_wv

model:               # unchanged from exp 001
  type: lightgbm
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 255
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
