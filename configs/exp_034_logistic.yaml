# Experiment 034_logistic: predictor-type comparison for the report (§5): same 39 features as
# exp 029, another model family. Not a submission candidate.

name: exp_034_logistic
change: "exp 029 with logistic regression (linear model) instead of LightGBM (same features)"
compare_to: exp_029_main_river

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics
  - relaxed_dp
  - tokke_vinje
  - relaxed_lp_shop2

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean
  - wv_up_end
  - wv_up_start
  - wv_dn_end
  - net_wv

model:
  type: logistic
  row_share: 0.35
  seed: 0
  params:
    C: 1.0
    max_iter: 300
