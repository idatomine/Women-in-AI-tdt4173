name: exp_047_xgb_no_next_week_price
change: 'XGBoost twin of exp 046: identical 54 features (no prices from after the case week), settings as exp 041'
compare_to: exp_041_xgb_dispatch_context
features:
- price_shape
- calendar
- water_value
- hydro
- unit_static
- wv_margin
- scarcity
- case_economics
- relaxed_dp
- tokke_vinje
- relaxed_lp_best
- lp_dispatch_context
drop_features:
- price
- price_wkmean
- wv_up_end
- wv_up_start
- wv_dn_end
- net_wv
- scarcity_end
- next_week_price
model:
  type: xgboost
  row_share: 0.35
  seed: 0
  params:            # same as exp 030; matched to LightGBM's settings in exp 046
    n_estimators: 800
    learning_rate: 0.05
    grow_policy: lossguide   # leaf-wise like LightGBM
    max_leaves: 127
    max_depth: 0
    min_child_weight: 50     # ≈ LightGBM's min_child_samples 200 (hessian ≤ 0.25 per row)
    subsample: 0.8
    colsample_bytree: 0.8
