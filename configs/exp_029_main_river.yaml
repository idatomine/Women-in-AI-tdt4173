# Experiment 024: exp 021, but with the more SHOP-like LP from the BRIEFING §9 loop:
# production curves from the YAML efficiency curves and head losses, plus SHOP's river
# flow costs. LP sanity check: unit_on 0.8473 → 0.8885, margin 0.9207 → 0.9289.

name: exp_029_main_river
change: "exp 024 with main_river in the LP (Hyljelihyl valued along r_Hyljelihyl, not the bypass): relaxed_lp_shop2 instead of relaxed_lp_shop"
compare_to: exp_024_lp_shop

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics
  - relaxed_dp
  - tokke_vinje
  - relaxed_lp_shop2

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean
  - wv_up_end
  - wv_up_start
  - wv_dn_end
  - net_wv

model:               # unchanged from exp 001
  type: lightgbm
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
