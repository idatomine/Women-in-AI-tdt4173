# Experiment 006: exp 002 + the profitable_blocks group (BRIEFING §4.1 #4).
# Hypothesis: a start cost only pays off over a long enough profitable stretch, so the
# length of the profitable block containing hour t (and the hours to its edges) predicts
# ON better than the hourly margin alone.

name: exp_006_profitable_blocks
change: exp 002 + profitable_blocks (length of the profitable run around each hour)
compare_to: exp_002_no_raw_eur

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics
  - profitable_blocks

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean
  - wv_up_end
  - wv_up_start
  - wv_dn_end
  - net_wv

model:               # unchanged from exp 001
  type: lightgbm
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
