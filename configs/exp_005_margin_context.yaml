# Experiment 005: exp 002 + the margin_context group (BRIEFING §4.1 #3).
# Hypothesis: decisions are sticky (start costs), so the margin in the hours around t
# predicts ON at t better than the margin at t alone. Expect gains on Tokke/Vinje timing.

name: exp_005_margin_context
change: exp 002 + margin_context (margin in neighbouring hours, rolling means, within-day price rank)
compare_to: exp_002_no_raw_eur

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics
  - margin_context

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean
  - wv_up_end
  - wv_up_start
  - wv_dn_end
  - net_wv

model:               # unchanged from exp 001
  type: lightgbm
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
