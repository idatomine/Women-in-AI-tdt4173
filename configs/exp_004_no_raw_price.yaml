# Experiment 004: like 002, but keep the raw water values. In 002 dropping all raw EUR
# levels gave A +0.015 but D −0.0024 over two seeds (Tokke G2/G4, Haukeli). Hypothesis:
# the raw *price* level is the regime-dependent part; the water-value levels carry
# scarcity information Tokke needs.

name: exp_004_no_raw_price
change: exp 001 without raw price levels (price, price_wkmean); raw water values kept
compare_to: exp_001_baseline_v2

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean

model:               # unchanged from exp 001
  type: lightgbm
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
