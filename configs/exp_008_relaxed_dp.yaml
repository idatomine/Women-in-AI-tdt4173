# Experiment 008: exp 007 + the relaxed_dp group (BRIEFING §4.5 Level 1, main track step 1).
# Hypothesis: an optimal on/off path that pays start costs captures SHOP's timing
# (persistence through short dips, no starts for short peaks) better than hourly margin
# features. Expect the biggest gains on Tokke and Vinje.

name: exp_008_relaxed_dp
change: "exp 007 + relaxed_dp (per-plant DP with start costs: on/off path, regret, units on)"
compare_to: exp_007_hydro_pressure

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics
  - hydro_pressure
  - relaxed_dp

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean
  - wv_up_end
  - wv_up_start
  - wv_dn_end
  - net_wv

model:               # unchanged from exp 001
  type: lightgbm
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
