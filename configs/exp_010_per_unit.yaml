# Experiment 010: exp 009, but one model per unit (BRIEFING §4.2; models.py per_unit).
# Hypothesis: units differ in what drives them (Lio: constraints, Haukeli: near run-of-river,
# Tokke: Vinje), and peers found per-unit models slightly better. Same row share, so each
# model sees 1/14 of the pooled model's rows.

name: exp_010_per_unit
change: "exp 009 with one LightGBM model per unit instead of one pooled model"
compare_to: exp_009_tokke_vinje

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics
  - hydro_pressure
  - relaxed_dp
  - tokke_vinje

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean
  - wv_up_end
  - wv_up_start
  - wv_dn_end
  - net_wv

model:               # unchanged from exp 001
  type: lightgbm
  per_unit: true     # one model per unit
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
