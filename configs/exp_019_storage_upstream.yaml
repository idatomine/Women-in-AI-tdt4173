# Experiment 019: exp 017 + the storage_upstream group.
# Haukeli (AUC 0.907, the weakest unit) takes water from Vatjern, whose volume data is a
# constant placeholder, so the model can't see Haukeli's real storage, Langeidvatn. Haukeli
# follows Langeidvatn's fill (runs at negative margins when it's full, stays off at positive
# margins when it's low). Expect a gain on Haukeli only.

name: exp_019_storage_upstream
change: "exp 017 + storage_upstream (fill of the real storage lake behind tiny pass-through reservoirs: Haukeli sees Langeidvatn)"
compare_to: exp_017_lp_minflow

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics
  - relaxed_dp
  - tokke_vinje
  - relaxed_lp_minflow
  - storage_upstream

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean
  - wv_up_end
  - wv_up_start
  - wv_dn_end
  - net_wv

model:               # unchanged from exp 001
  type: lightgbm
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
