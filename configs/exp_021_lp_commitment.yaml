# Experiment 021: exp 017, but the LP also has a relaxed unit commitment (units on, p_min,
# start/stop costs). Hypothesis: start costs combined with the water balance improve the
# hourly timing. Sanity check: LP unit-on AUC 0.842 → 0.847 (Vinje G1 +0.03, Haukeli +0.03).

name: exp_021_lp_commitment
change: "exp 017 with the LP variant that adds a relaxed unit commitment (start/stop costs, p_min): relaxed_lp_uc instead of relaxed_lp_minflow"
compare_to: exp_017_lp_minflow

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics
  - relaxed_dp
  - tokke_vinje
  - relaxed_lp_uc

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean
  - wv_up_end
  - wv_up_start
  - wv_dn_end
  - net_wv

model:               # unchanged from exp 001
  type: lightgbm
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
