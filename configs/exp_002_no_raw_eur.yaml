# Experiment 002: drop the raw EUR/MWh level features (BRIEFING §2.4, §6).
#
# Hypothesis: raw price and water-value levels tie the model to each year's price regime
# (2020 ≈ 9 EUR/MWh, 2022 ≈ 211, test has negative prices). Their relative versions
# (price_z, price_rank, price_rel, net_wv_rel, the margins, scarcity) stay in. Expect
# the biggest effect on fold A (2020), the weakest fold in exp 001.

name: exp_002_no_raw_eur
change: exp 001 without the 6 raw EUR level features (price, price_wkmean, raw water values)
compare_to: exp_001_baseline_v2

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean
  - wv_up_end
  - wv_up_start
  - wv_dn_end
  - net_wv

model:               # unchanged from exp 001
  type: lightgbm
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
