# Experiment 011: exp 009 + the cascade group (generalises exp 009's finding).
# Hypothesis: water released into a plant's upstream reservoir must be passed on, so a
# plant runs when its feeders run (Tokke 99.5% when Vinje runs). Adds this for Hogga (fed
# by Tokke), Lio (Byrte) and Kjela (Vesle Kjela). Expect gains on Lio, a weak unit.

name: exp_011_cascade
change: "exp 009 + cascade (each plant sees the DP schedule of the plants feeding its reservoir)"
compare_to: exp_009_tokke_vinje

features:            # same groups as exp 001
  - price_shape
  - calendar
  - water_value
  - hydro
  - unit_static
  - wv_margin
  - scarcity
  - case_economics
  - hydro_pressure
  - relaxed_dp
  - tokke_vinje
  - cascade

drop_features:       # single features removed from the groups above
  - price
  - price_wkmean
  - wv_up_end
  - wv_up_start
  - wv_dn_end
  - net_wv

model:               # unchanged from exp 001
  type: lightgbm
  row_share: 0.35
  seed: 0
  params:
    n_estimators: 800
    learning_rate: 0.05
    num_leaves: 127
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
